# Settings for the runtime closure install; no workspace members.
#
# pnpm 11 reads only auth and registry settings from .npmrc; layout and peer
# handling live here. The flat hoisted layout keeps runtime/node_modules a real
# directory tree, which is what the installer ships as extraResources.
nodeLinker: hoisted
autoInstallPeers: true
# Every dependency is exact-pinned through @deepseek-ai/dsh's locked version,
# so pnpm's fresh-release age gate adds no protection here; disable it rather
# than carry an auto-generated per-package exclusion list.
minimumReleaseAge: 0
# Same build-script review decisions as the upstream harness workspace:
# node-pty (ConPTY/PTY native) and koffi (Windows durability) may build;
# dsh-subprocess-local's reviewed postinstall restores the executable bit on
# node-pty's macOS spawn helper. The remaining script-shipping transitive deps
# carry no-op scripts and are denied.
allowBuilds:
  node-pty: true
  koffi: true
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': false
  protobufjs: false
  node-addon-require-builtin: false
overrides:
  '@deepseek-ai/dsh-anonymous-user-id': 0.1.2-rc.1
  '@deepseek-ai/dsh-attachment': 0.1.2-rc.1
  '@deepseek-ai/dsh-bash-local': 0.1.2-rc.1
  '@deepseek-ai/dsh-code-runtime': 0.1.2-rc.1
  '@deepseek-ai/dsh-compaction': 0.1.2-rc.1
  '@deepseek-ai/dsh-fs': 0.1.2-rc.1
  '@deepseek-ai/dsh-jobs': 0.1.2-rc.1
  '@deepseek-ai/dsh-output-retention': 0.1.2-rc.1
  '@deepseek-ai/dsh-sandbox': 0.1.2-rc.1
  '@deepseek-ai/dsh-session-persistence': 0.1.2-rc.1
  '@deepseek-ai/dsh-session-query': 0.1.2-rc.1
  '@deepseek-ai/dsh-session-telemetry': 0.1.2-rc.1
  '@deepseek-ai/dsh-session-title-llm': 0.1.2-rc.1
  '@deepseek-ai/dsh-settings': 0.1.2-rc.1
  '@deepseek-ai/dsh-shell': 0.1.2-rc.1
  '@deepseek-ai/dsh-spill': 0.1.2-rc.1
  '@deepseek-ai/dsh-subagent-in-process-driver': 0.1.2-rc.1
  '@deepseek-ai/dsh-workflow': 0.1.2-rc.1
