# Build the standalone desktop shell for Windows (nsis + zip), Linux
# (AppImage + deb), and macOS (dmg + zip, arm64 and x64). A desktop-v* tag
# push builds all platforms and publishes: electron-builder --publish always
# creates the GitHub release (releaseType: release, so auto-update sees it)
# and uploads the artifacts. Pull requests and master pushes touching desktop
# run the same build with --publish never as validation.
name: Release (Desktop)

on:
  push:
    tags: ['desktop-v*']
    branches: [master]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-release.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-release.yml'

# electron-builder creates the release and uploads artifacts through the
# GH_TOKEN env var below. Pull request runs from forks get a read-only token
# regardless of this setting.
permissions:
  contents: write

env:
  # The smoke test boots the dsh web server; keep it off the production
  # telemetry endpoint.
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  windows:
    name: Windows / nsis + zip
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            desktop/pnpm-lock.yaml
            desktop/runtime/pnpm-lock.yaml

      - name: Install desktop dependencies
        run: pnpm --dir desktop install --frozen-lockfile

      - name: Fetch bundled Node runtime
        run: pnpm --dir desktop run fetch-node

      - name: Typecheck
        run: pnpm --dir desktop run typecheck

      - name: Unit tests
        run: pnpm --dir desktop run test

      - name: Install dsh runtime closure
        run: pnpm --dir desktop run runtime:install

      - name: Build electron main
        run: pnpm --dir desktop run build:electron

      - name: Smoke test (headless)
        run: pnpm --dir desktop run smoke

      - name: Package installers and publish
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'desktop-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional Authenticode signing: with repo secrets CSC_LINK (base64
          # PFX) and CSC_KEY_PASSWORD set, electron-builder signs the
          # installers; unset secrets keep the current unsigned behavior.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: pnpm --dir desktop exec electron-builder --win nsis zip --publish always

      - name: Package installers (validation)
        if: github.ref_type != 'tag' || !startsWith(github.ref_name, 'desktop-v')
        run: pnpm --dir desktop exec electron-builder --win nsis zip --publish never

      - name: Smoke test the packaged sidecar
        shell: bash
        working-directory: desktop
        env:
          SMOKE_NODE: dist/win-unpacked/resources/node/node.exe
          SMOKE_DSH_DIR: dist/win-unpacked/resources/dsh/node_modules/@deepseek-ai/dsh
        run: node scripts/smoke-sidecar.mjs

  linux:
    name: Linux / AppImage + deb
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The windows job creates the GitHub release; publishing after it keeps
    # the two jobs from racing to create the same v<version> release.
    needs: windows
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            desktop/pnpm-lock.yaml
            desktop/runtime/pnpm-lock.yaml

      - name: Install desktop dependencies
        run: pnpm --dir desktop install --frozen-lockfile

      - name: Fetch bundled Node runtime
        run: pnpm --dir desktop run fetch-node

      - name: Typecheck
        run: pnpm --dir desktop run typecheck

      - name: Unit tests
        run: pnpm --dir desktop run test

      - name: Install dsh runtime closure
        run: pnpm --dir desktop run runtime:install

      - name: Build electron main
        run: pnpm --dir desktop run build:electron

      - name: Smoke test (headless)
        run: pnpm --dir desktop run smoke

      - name: Package installers and publish
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'desktop-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --dir desktop exec electron-builder --linux AppImage deb --publish always

      - name: Package installers (validation)
        if: github.ref_type != 'tag' || !startsWith(github.ref_name, 'desktop-v')
        run: pnpm --dir desktop exec electron-builder --linux AppImage deb --publish never

      - name: Smoke test the packaged sidecar
        shell: bash
        working-directory: desktop
        env:
          SMOKE_NODE: dist/linux-unpacked/resources/node/bin/node
          SMOKE_DSH_DIR: dist/linux-unpacked/resources/dsh/node_modules/@deepseek-ai/dsh
        run: node scripts/smoke-sidecar.mjs

  macos:
    name: macOS / dmg + zip (${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    # The windows job creates the GitHub release; this job only uploads its
    # arch-suffixed artifacts, so it can run in parallel with linux.
    needs: windows
    strategy:
      fail-fast: false
      matrix:
        # Each arch builds natively: an x64 sidecar Node under Rosetta on the
        # arm64 runner crashed natively mid-boot, so x64 runs on an Intel
        # image (macos-26-intel is the successor if macos-15-intel retires).
        include:
          - arch: arm64
            runs-on: macos-latest
            unpacked: mac-arm64
          - arch: x64
            runs-on: macos-15-intel
            unpacked: mac
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            desktop/pnpm-lock.yaml
            desktop/runtime/pnpm-lock.yaml

      - name: Install desktop dependencies
        run: pnpm --dir desktop install --frozen-lockfile

      - name: Fetch bundled Node runtime (${{ matrix.arch }})
        run: pnpm --dir desktop exec node scripts/fetch-node.mjs --arch ${{ matrix.arch }}

      - name: Typecheck
        run: pnpm --dir desktop run typecheck

      - name: Unit tests
        run: pnpm --dir desktop run test

      - name: Install dsh runtime closure
        run: pnpm --dir desktop run runtime:install

      - name: Build electron main
        run: pnpm --dir desktop run build:electron

      - name: Smoke test (headless)
        run: pnpm --dir desktop run smoke

      - name: Package installers and publish
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'desktop-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --dir desktop exec electron-builder --mac dmg zip --${{ matrix.arch }} --publish always

      - name: Package installers (validation)
        if: github.ref_type != 'tag' || !startsWith(github.ref_name, 'desktop-v')
        run: pnpm --dir desktop exec electron-builder --mac dmg zip --${{ matrix.arch }} --publish never

      - name: Smoke test the packaged sidecar
        shell: bash
        working-directory: desktop
        env:
          # macOS unpacked builds live inside the .app bundle, not a bare
          # resources/ directory like Windows and Linux.
          SMOKE_NODE: "dist/${{ matrix.unpacked }}/DSH Desktop.app/Contents/Resources/node/bin/node"
          SMOKE_DSH_DIR: "dist/${{ matrix.unpacked }}/DSH Desktop.app/Contents/Resources/dsh/node_modules/@deepseek-ai/dsh"
        run: node scripts/smoke-sidecar.mjs
